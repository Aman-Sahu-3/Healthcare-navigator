name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          # CPU-only torch keeps CI fast (the default Linux wheel bundles CUDA, ~2 GB)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    # Builds both images and smoke-tests the running stack end to end.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      ADMIN_API_KEY: ci-admin-key   # enables /ingest for the embedding test below
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose build
      - name: Start stack (no LLM key -> API reports "degraded", which is expected)
        run: |
          # The API runs as a non-root user; let it write to the bind-mounted folders.
          mkdir -p data/raw data/export && chmod 777 data/raw data/export
          docker compose up -d
      - name: Wait for the API through nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health; then echo; exit 0; fi
            sleep 5
          done
          echo "API never became reachable"; exit 1
      - name: Smoke test
        run: |
          set -e
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/some/client/route | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/health | grep -q '"version"'
          curl -fsS http://localhost:8080/api/health/live | grep -q alive
          curl -fsS http://localhost:8080/api/sources | grep -q '"count"'
          # /query without an LLM key must fail cleanly with the standard error format
          code=$(curl -s -o out.json -w "%{http_code}" -X POST http://localhost:8080/api/query \
                 -H "Content-Type: application/json" -d '{"question":"test question"}')
          test "$code" = "503" && grep -q llm_not_configured out.json
          curl -sI http://localhost:8080/ | grep -qi "x-frame-options: DENY"
          docker compose ps
      - name: Real embedding model works inside the image (upload -> embed -> index -> export)
        run: |
          set -e
          python3 .github/scripts/make_sample_pdf.py sample.pdf
          curl -fsS -X POST http://localhost:8080/api/ingest/upload \
               -H "X-API-Key: $ADMIN_API_KEY" -F "file=@sample.pdf;type=application/pdf" | tee ingest.json
          grep -q '"status":"ingested"' ingest.json
          curl -fsS http://localhost:8080/api/sources | grep -q '"count":1'
          docker compose exec -T api python -m app.ingestion --search "first-line hypertension treatment" -k 1 | tee search.txt
          grep -q "sample.pdf" search.txt
          docker compose exec -T api python -m app.ingestion --export /data/export/index.tar.gz
          test -s data/export/index.tar.gz
      - name: Logs
        if: always()
        run: docker compose logs --no-color | tail -200
      - name: Tear down
        if: always()
        run: docker compose down -v

