[project]
name = "healthcare-navigator"
version = "0.1.0"
description = "Medical RAG assistant: evidence-based answers from clinical guidelines with citations and confidence scoring."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    # Phase 1 — ingestion
    "pymupdf>=1.24",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-chroma>=0.1",
    "fastembed>=0.9,<1.0",        # ONNX embeddings (replaced PyTorch + sentence-transformers)
    "chromadb>=1.0,<2.0",
    # Phase 2 — RAG chain
    "langchain-openai>=0.2",
    # Phase 4 — REST API (file uploads)
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"
