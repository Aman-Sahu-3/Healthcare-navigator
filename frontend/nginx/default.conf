# Serves the built React app and proxies /api/* to the FastAPI container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PDF uploads go through /api/ingest/upload (API limit is MAX_UPLOAD_MB, default 25)
    client_max_body_size 30m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Trailing slash strips the /api prefix: /api/query -> http://api:8000/query
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients can't spoof their IP for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite puts content-hashed files in /assets -> safe to cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Single-page app: unknown paths serve index.html; never cache it
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
